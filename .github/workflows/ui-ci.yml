name: BendCore UI build and browser tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Static and functional checks
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python browser test dependencies
        run: python -m pip install -r e2e/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start preview server
        run: |
          (npm run preview -- --port 4173 --strictPort > /tmp/bendcore-vite.log 2>&1 & echo $! > /tmp/bendcore-vite.pid)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/bendcore-vite.log
          exit 1
      - name: Browser E2E tests
        env:
          BENDCORE_URL: http://127.0.0.1:4173
        run: python -m pytest e2e/ -v --junitxml=test-results/playwright.xml
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-ui-test-results
          path: |
            test-results/
            /tmp/bendcore-vite.log
          if-no-files-found: ignore
